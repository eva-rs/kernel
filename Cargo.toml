[workspace]
resolver = "3"
members = [
  "protocol",
  "core",
  "rpc",
  "sdk",
  "providers/mock",
  "providers/openai",
  "providers/embed-local",
  "providers/all",
  "services/kernel",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
eva = { path = "../../viendesu/eva" }
eva-hands = { path = "../hands", default-features = false }

eva-protocol = { path = "protocol" }
eva-core = { path = "core" }
eva-rpc = { path = "rpc" }
eva-sdk = { path = "sdk" }
eva-provider-mock = { path = "providers/mock" }
eva-provider-openai = { path = "providers/openai" }
eva-provider-embed-local = { path = "providers/embed-local" }
eva-providers = { path = "providers/all" }

eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
jsonschema = { version = "0.56", default-features = false }
serde_with = { version = "3", default-features = false, features = ["alloc", "macros"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
rmp = "0.8"
futures = "0.3"
futures-core = "0.3"
futures-sink = "0.3"
bytes = { version = "1", features = ["serde"] }
pin-project-lite = "0.2"
async-stream = "0.3"
log = { version = "0.4", features = ["kv"] }
fastrace = "0.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "socks"] }
eventsource-stream = "0.2"
base64 = "0.22"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "functions", "serde_json", "limits"] }
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
snow = "0.10"
socket2 = { version = "0.6", features = ["all"] }
hkdf = "0.12"
sha2 = "0.10"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }

insta = { version = "1", features = ["json"] }
tempfile = "3"
proptest = "1"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
