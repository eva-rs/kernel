[package]
name = "eva-providers"
version.workspace = true
edition.workspace = true
description = "Provider config (tag kind) and AnyProvider dispatch over compiled-in provider crates."

[features]
default = ["openai", "mock"]
openai = ["dep:eva-provider-openai"]
mock = ["dep:eva-provider-mock"]

[dependencies]
eva-protocol.workspace = true
eva-core.workspace = true
eva.workspace = true
serde.workspace = true
eva-provider-openai = { workspace = true, optional = true }
eva-provider-mock = { workspace = true, optional = true }

[lints]
workspace = true
